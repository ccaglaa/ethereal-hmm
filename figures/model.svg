<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How Ethereal HMM works</title>
  <desc>POP909 songs train three models. Hidden chords, one per beat, form a Markov chain; each chord emits the note played under it, which also depends on the previous note; a rhythm model decides when notes start. The hidden chords become the pad, the observed notes become the lead, and a NumPy synth renders WAV and MIDI.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b68ee"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0447e"/>
    </marker>
  </defs>

  <rect width="960" height="400" rx="14" fill="#fcfcfb"/>

  <!-- 1. data -->
  <text x="30" y="40" font-size="12" font-weight="700" fill="#7b68ee" letter-spacing="1">1  DATA</text>
  <rect x="30" y="56" width="170" height="150" rx="10" fill="#ffffff" stroke="#f0d3df"/>
  <text x="46" y="84" font-size="15" font-weight="700" fill="#0b0b0b">POP909</text>
  <text x="46" y="108" font-size="12" fill="#52514e">909 pop songs</text>
  <text x="46" y="128" font-size="12" fill="#52514e">melody + chords</text>
  <text x="46" y="148" font-size="12" fill="#52514e">moved to C or Am</text>
  <text x="46" y="168" font-size="12" fill="#52514e">16th-note grid</text>
  <text x="46" y="188" font-size="12" fill="#52514e">605 songs to train</text>
  <path d="M200 131 L238 131" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow-ink)"/>

  <!-- 2. model -->
  <text x="250" y="40" font-size="12" font-weight="700" fill="#e0447e" letter-spacing="1">2  THE HIDDEN MARKOV MODEL</text>
  <rect x="246" y="56" width="430" height="300" rx="12" fill="#ffffff" stroke="#f0d3df"/>

  <text x="262" y="82" font-size="11" fill="#7b68ee" font-weight="700">hidden: one chord per beat</text>
  <text x="660" y="82" font-size="11" fill="#52514e" text-anchor="end">Markov chain, order 4</text>
  <!-- chords -->
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="270" y="94" width="72" height="34" rx="17" fill="#7b68ee"/><text x="306" y="116">Am</text>
    <rect x="370" y="94" width="72" height="34" rx="17" fill="#7b68ee"/><text x="406" y="116">F</text>
    <rect x="470" y="94" width="72" height="34" rx="17" fill="#7b68ee"/><text x="506" y="116">G</text>
    <rect x="570" y="94" width="72" height="34" rx="17" fill="#7b68ee"/><text x="606" y="116">Am</text>
  </g>
  <g stroke="#7b68ee" stroke-width="1.6" fill="none">
    <path d="M342 111 L366 111" marker-end="url(#arrow-violet)"/>
    <path d="M442 111 L466 111" marker-end="url(#arrow-violet)"/>
    <path d="M542 111 L566 111" marker-end="url(#arrow-violet)"/>
  </g>

  <!-- emissions -->
  <g stroke="#52514e" stroke-width="1.3" fill="none" stroke-dasharray="4 3">
    <path d="M306 128 L306 196" marker-end="url(#arrow-ink)"/>
    <path d="M406 128 L406 196" marker-end="url(#arrow-ink)"/>
    <path d="M506 128 L506 196" marker-end="url(#arrow-ink)"/>
    <path d="M606 128 L606 196" marker-end="url(#arrow-ink)"/>
  </g>
  <text x="456" y="158" font-size="11.5" fill="#0b0b0b" text-anchor="middle">P(note | chord,</text>
  <text x="456" y="174" font-size="11.5" fill="#0b0b0b" text-anchor="middle">previous note)</text>

  <!-- notes -->
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="306" cy="218" r="20" fill="#e0447e"/><text x="306" y="223">E</text>
    <circle cx="406" cy="218" r="20" fill="#e0447e"/><text x="406" y="223">A</text>
    <circle cx="506" cy="218" r="20" fill="#e0447e"/><text x="506" y="223">D</text>
    <circle cx="606" cy="218" r="20" fill="#e0447e"/><text x="606" y="223">C</text>
  </g>
  <g stroke="#e0447e" stroke-width="1.6" fill="none">
    <path d="M326 218 L382 218" marker-end="url(#arrow-pink)"/>
    <path d="M426 218 L482 218" marker-end="url(#arrow-pink)"/>
    <path d="M526 218 L582 218" marker-end="url(#arrow-pink)"/>
  </g>
  <text x="262" y="262" font-size="11" fill="#e0447e" font-weight="700">observed: the melody notes</text>

  <!-- rhythm -->
  <line x1="270" y1="290" x2="652" y2="290" stroke="#f0d3df" stroke-width="2"/>
  <g fill="#e0447e">
    <rect x="270" y="282" width="3" height="16"/><rect x="306" y="282" width="3" height="16"/>
    <rect x="324" y="282" width="3" height="16"/><rect x="370" y="282" width="3" height="16"/>
    <rect x="406" y="282" width="3" height="16"/><rect x="470" y="282" width="3" height="16"/>
    <rect x="488" y="282" width="3" height="16"/><rect x="506" y="282" width="3" height="16"/>
    <rect x="570" y="282" width="3" height="16"/><rect x="624" y="282" width="3" height="16"/>
  </g>
  <text x="262" y="320" font-size="11" fill="#52514e">rhythm: when the next note starts, given its place in the beat</text>
  <text x="262" y="340" font-size="11" fill="#52514e">form: a 4-bar theme played A A' B A'', ending dominant then home</text>
  <path d="M642 111 C 690 111, 690 87, 716 87" stroke="#7b68ee" stroke-width="1.6" fill="none" marker-end="url(#arrow-violet)"/>
  <path d="M626 218 C 690 218, 690 159, 716 159" stroke="#e0447e" stroke-width="1.6" fill="none" marker-end="url(#arrow-pink)"/>

  <!-- 3. sound -->
  <text x="726" y="40" font-size="12" font-weight="700" fill="#7b68ee" letter-spacing="1">3  SOUND</text>
  <rect x="722" y="56" width="208" height="62" rx="10" fill="#f1eefe"/>
  <text x="738" y="82" font-size="13" font-weight="700" fill="#4b3cc4">Pad</text>
  <text x="738" y="102" font-size="11" fill="#52514e">the hidden chords, voiced</text>
  <rect x="722" y="128" width="208" height="62" rx="10" fill="#fde8f0"/>
  <text x="738" y="154" font-size="13" font-weight="700" fill="#c02d65">Lead</text>
  <text x="738" y="174" font-size="11" fill="#52514e">the observed notes</text>
  <path d="M826 190 L826 222" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
  <rect x="722" y="226" width="208" height="62" rx="10" fill="#ffffff" stroke="#f0d3df"/>
  <text x="738" y="252" font-size="13" font-weight="700" fill="#0b0b0b">NumPy synth</text>
  <text x="738" y="272" font-size="11" fill="#52514e">detune, delay, reverb</text>
  <path d="M826 288 L826 316" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
  <rect x="722" y="320" width="208" height="36" rx="18" fill="#e0447e"/>
  <text x="826" y="343" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">WAV + MIDI</text>
</svg>
